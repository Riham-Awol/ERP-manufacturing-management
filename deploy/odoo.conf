[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

; Demo credentials. Change both before this leaves a laptop.
admin_passwd = aifa_demo_master
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo_demo_only

; The suite is comfortable at the FRS volumes (50 concurrent users,
; ~250k batch records over five years) on modest hardware. Raise workers
; for a real deployment; 0 keeps the demo single-process so that
; `odoo shell` and the server do not fight over the database.
workers = 0
limit_time_cpu = 600
limit_time_real = 1200

log_level = info

; Pin the demo to one database. Without this, Odoo either shows a database
; selector or silently auto-picks whatever single database it finds - and if
; that one is broken or half-installed you get a bare "Internal Server Error"
; with no clue which database it tried. Pinning it makes / go straight to the
; login page of the right database.
db_name = aifa_demo
dbfilter = ^aifa_demo$

; Leave True while you are creating the demo database, then set it to False
; for anything reachable from the internet: the database manager can drop
; databases.
list_db = True

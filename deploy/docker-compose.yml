# Aifa Agro ERP - demo stack
#
#   docker compose up -d
#   docker compose exec odoo python3 /mnt/aifa-tools/create_db.py aifa_demo
#   docker compose exec odoo odoo -d aifa_demo \
#       -i aifa_base,aifa_sourcing,aifa_processing,aifa_quality,aifa_traceability,aifa_consignment,aifa_impact \
#       --stop-after-init
#   docker compose exec -T odoo odoo shell -d aifa_demo < ../tools/seed_demo.py
#   docker compose exec -T odoo odoo shell -d aifa_demo < ../tools/smoke_test.py
#
# Then http://localhost:8069  (admin / admin)
#
# This is a demo stack. Before anything resembling production: change the
# passwords below, put TLS in front of Odoo, and set up off-site backups.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_demo_only
      POSTGRES_DB: postgres
    volumes:
      - aifa-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:17.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo_demo_only
    volumes:
      - aifa-odoo:/var/lib/odoo
      - ../addons:/mnt/extra-addons:ro
      - ../tools:/mnt/aifa-tools:ro
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
    command: odoo

volumes:
  aifa-db:
  aifa-odoo:
